name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: Hooks on the changed files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      - name: Run the hooks on the files this pull request changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP: no-commit-to-branch
        run: uvx prek run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure

  validate:
    name: Render and audit the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Validate Quarto front matter
        run: bash scripts/validate_quarto.sh $(find pages -name "*.qmd")

      - name: Validate bibliography files
        run: |
          if find . -name "*.bib" -not -path "./_site/*" | grep -q .; then
            bash scripts/validate_bib.sh $(find . -name "*.bib" -not -path "./_site/*")
          fi

      - name: Validate image assets
        run: bash scripts/validate_images.sh $(find pages -name "*.qmd")

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b  # v2
        with:
          version: 1.8.26

      - name: Test render
        run: quarto render

      - name: Audit the rendered site
        run: python3 scripts/audit_site.py _site

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2
        with:
          args: >-
            --offline --no-progress --include-fragments
            --root-dir ${{ github.workspace }}/_site
            --exclude-path _site/search.json --exclude-path _site/assets/html
            '_site/**/*.html'
          fail: true
