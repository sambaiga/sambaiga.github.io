[project]
name = "sambaiga-website"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["_site", "_freeze", ".venv", "_extensions", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "S"]
ignore = ["D203", "D213", "S101", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"
