project:
  type: website
  output-dir: _site
  pre-render:
    - bash assets/bash/generate_thumbs.sh
  post-render:
    - python3 scripts/post_render.py
  render:
    - "*.qmd"
    - "pages/**/*.qmd"
    - "pages/**/*.ipynb"
    - "!pages/project/"

  preview:
    port: 5556
    browser: true
    watch-inputs: true
    navigate: true


  resources:
    - "assets/**"
    - "images/**"
    - "data/**"
    - "files/**"

    # Things that need to be at the site root
    - "pgp_ath.asc.txt"



website:
  title: "Anthony Faustine"
  description: "Principal Machine Learning Engineer at Analog Devices, Ireland. Machine learning system architecture and design, time series algorithm development and strategic management of technology."
  favicon: "/images/brand/favicon.ico"
  site-url: "https://sambaiga.github.io"
  draft-mode: gone
  repo-url: "https://github.com/sambaiga/sambaiga.github.io"
  page-navigation: true



  open-graph:
    title: "Anthony Faustine"
    description: "Principal Machine Learning Engineer at Analog Devices, Ireland. Machine learning system architecture and design, time series algorithm development and strategic management of technology."
    image: "images/og/default.png"
    locale: en_IE

  twitter-card:
    card-style: summary_large_image
    creator: "@sambaiga"
    site: "@sambaiga"

  navbar:
    logo: "images/brand/badge.svg"
    logo-alt: "sambaiga logo"
    pinned: true
    collapse: true
    left:
      - href: index.qmd
        text: Home
      - text: "About"
        file: "pages/about/index.qmd"
      - text: "Blog"
        file: "pages/blog/index.qmd"
      - text: "Projects"
        file: "pages/projects/index.qmd"
      - text: "Books"
        file: "pages/books/index.qmd"
      - text: "Research"
        file: "pages/publication/index.qmd"

    right:
      - text: "<i class='bi bi-envelope-at' style='font-size:1.1em' aria-hidden='true'></i><span class='visually-hidden'>Email</span>"
        href: "mailto:sambaiga@gmail.com"
      - text: "<i class='bi bi-github' style='font-size:1.1em' aria-hidden='true'></i><span class='visually-hidden'>GitHub</span>"
        href: https://github.com/sambaiga
        rel: me
      - text: "<i class='bi bi-linkedin' style='font-size:1.1em' aria-hidden='true'></i><span class='visually-hidden'>LinkedIn</span>"
        href: https://www.linkedin.com/in/sambaiga
        rel: me

  page-footer:
    center: |
      <span class="foot-copy">© Anthony Faustine · [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) · Built with [Quarto](https://quarto.org/)</span>
      <span class="foot-links">[<i class="bi bi-orcid" aria-hidden="true"></i> ORCID](https://orcid.org/{{< var orcid >}}) [<i class="bi bi-key" aria-hidden="true"></i> PGP key]({{< var pgp.key >}}) [<i class="bi bi-github" aria-hidden="true"></i> Source]({{< var github-url >}})</span>
      <span class="foot-print">PGP fingerprint <code>{{< var pgp.fingerprint >}}</code></span>

icons:
  bootstrap: true

format:
  html:
    include-in-header:
      - text: |
          <link rel="preload" href="/assets/fonts/libre-franklin-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
          <link rel="preload" href="/assets/fonts/jost-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
    theme:
      light: [cosmo, assets/twiga.scss]
      dark: [darkly, assets/twiga-dark.scss]
    respect-user-color-scheme: true
    html-math-method: mathml
    canonical-url: true
    self-contained: false
    embed-resources: false
    responsive-images: true
    clean-urls: true
    code-link: false
    anchor-sections: true
    fig-cap-location: bottom
    reference-location: margin
    footnotes-hover: true
    aria: true
    toc: true
    reading-time: true


freeze: auto
citation: false
csl: assets/ieee.csl
execute:
  echo: true
  message: true
  warning: true
